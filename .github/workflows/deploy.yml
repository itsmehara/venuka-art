# =============================================================================
# Venuka — check, then publish
#
# Every push to `master` runs the checks in tools/check.js first. The site is
# only published if they all pass, so a stray comma in data.js can never take
# the live site down — the deploy simply doesn't happen and you get an email.
# =============================================================================
name: Check and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:        # lets you publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer one win rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the pre-deploy checks
        run: node tools/check.js

  deploy:
    name: Publish to GitHub Pages
    needs: check                                   # <- the gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Build the publishable folder. tools/build.js copies the website and ONLY
      # the website into dist/ — it works from a list of what belongs, so a new
      # working file is left out by default. This replaced a hand-written list of
      # files to delete, which had already fallen behind the repository once.
      - name: Assemble the site
        run: node tools/build.js

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'                             # only what the assembler copied

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
