# =============================================================================
# Venuka — check, then publish
#
# Every push to `main` runs the checks in tools/check.js first. The site is
# only published if they all pass, so a stray comma in data.js can never take
# the live site down — the deploy simply doesn't happen and you get an email.
# =============================================================================
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer one win rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the pre-deploy checks
        run: node tools/check.js

  deploy:
    name: Publish to GitHub Pages
    needs: check                                   # <- the gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # These are working documents for you, not pages of the website. They are
      # kept in the repository but not published, so nobody can read the project
      # notes by guessing a URL.
      - name: Keep internal notes out of the published site
        run: rm -f STATUS.html REGISTRY.md DEPLOYMENT.md CONTENT-GUIDE.md README.md

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'                                # everything that is left is the site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
