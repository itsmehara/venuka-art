<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--PROJECT_TITLE--></title>
<style>
/*
  Theme: DARK BY DEFAULT, always. The <html> tag carries data-theme="dark" and the bare
  :root holds the dark forest-green palette, so the page opens dark whatever the viewer's
  system preference is. The only light palette is the explicit [data-theme="light"] block,
  used when someone presses a Light button on purpose. Never make light the default and
  never key the default on prefers-color-scheme. Every colour below comes from these tokens.
*/
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1711; --surface:#122019; --surface-2:#17281f;
  --ink:#e9f1ea; --body:#bfcfc3; --muted:#92a498;
  --line:#23362b; --line-soft:#1b2b22;
  --brand:#4ea772; --brand-d:#9adcb1; --brand-l:#16301f;
  --amber:#dcaa4a; --amber-l:#33280f;
  --red:#e2907f; --red-l:#351f1b;
  --slate:#8fb3a7; --slate-l:#1e2f29;
  --display:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --text:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:14px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#faf8f4; --surface:#ffffff; --surface-2:#f3f1ea;
  --ink:#17231b; --body:#4c5750; --muted:#7c8880;
  --line:#e4e0d4; --line-soft:#ece9df;
  --brand:#1f7a40; --brand-d:#155429; --brand-l:#e8f3ec;
  --amber:#c9840f; --amber-l:#faf0dd;
  --red:#b23b3b; --red-l:#f7e9e7;
  --slate:#5b6b8f; --slate-l:#eaedf5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);
  font:16px/1.6 var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{color:var(--ink);font-family:var(--display);line-height:1.18;
  margin:0;font-weight:750;letter-spacing:-.02em;text-wrap:balance}
.wrap{max-width:940px;margin:0 auto;padding:44px 24px 90px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mark{width:38px;height:38px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));
  display:grid;place-items:center;color:#fff;font-size:19px;font-weight:800;font-family:var(--display)}
.top-text p{margin:0;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.top-text h1{font-size:1.5rem}
.updated{margin:18px 0 0;color:var(--muted);font-size:.88rem}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;margin:34px 0}
.summary>div{background:var(--surface);padding:20px 18px;text-align:center}
.summary b{display:block;font-size:2rem;font-family:var(--display);color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1}
.summary span{display:block;margin-top:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.summary .n-done b{color:var(--brand)}
.summary .n-draft b{color:var(--amber)}
.summary .n-flag b{color:var(--red)}
.summary .n-gap b{color:var(--slate)}

.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.i-done{background:var(--brand)}.i-draft{background:var(--amber)}
.i-flag{background:var(--red)}.i-gap{background:var(--slate)}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:1.2rem}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:.88rem}

.decision{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);
  border-radius:10px;padding:18px 20px;margin-bottom:12px}
.decision h3{font-size:.98rem;margin-bottom:6px}
.decision p{margin:0;font-size:.9rem;color:var(--body)}
.decision .tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:var(--red);background:var(--red-l);
  padding:3px 9px;border-radius:999px;margin-bottom:9px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden}
.row{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;
  border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row-text{flex:1;min-width:0}
.row-text h4{margin:0 0 3px;font-size:.96rem;font-weight:700;color:var(--ink);
  font-family:var(--display)}
.row-text p{margin:0;font-size:.86rem;color:var(--muted);line-height:1.5}
.row-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.admin-badge{font-size:.68rem;font-weight:700;color:var(--slate);background:var(--slate-l);
  padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill{flex:none;font-size:.72rem;font-weight:800;letter-spacing:.03em;
  padding:5px 11px;border-radius:999px;white-space:nowrap;margin-top:1px}
.pill-done{background:var(--brand-l);color:var(--brand-d)}
.pill-draft{background:var(--amber-l);color:var(--amber)}
.pill-gap{background:var(--slate-l);color:var(--slate)}

footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);
  font-size:.82rem;color:var(--muted)}
footer code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:.85em}

/* ---------- Tabs: Status / Tasks / Diagrams (Tasks and Diagrams appear only when data is given) ---------- */
.tabs{display:flex;gap:6px;margin:26px 0 4px;border-bottom:1px solid var(--line)}
.tabs[hidden]{display:none}
.tabs button{font:inherit;font-weight:700;font-size:.95rem;color:var(--muted);background:none;border:0;
  border-bottom:3px solid transparent;padding:10px 14px;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button span{display:inline-block;font-weight:800;font-size:.74rem;color:var(--brand-d);background:var(--brand-l);
  border:1px solid var(--brand);padding:2px 8px;border-radius:999px;margin-left:8px;font-variant-numeric:tabular-nums}
.panel[hidden]{display:none}
/* ---------- Fold: everything opens as one line (title + counts); the viewer expands on need ---------- */
.fold-bar{display:flex;gap:8px;justify-content:flex-end;margin:18px 0 8px}
.fold-bar button{font:inherit;font-size:.8rem;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--body)}
.fold-bar button:hover{border-color:var(--brand)}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:0}
details.fold[open]{border-color:var(--brand)}
details.fold>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  gap:6px 12px;padding:12px 16px}
details>summary::-webkit-details-marker{display:none}
details.fold>summary::before,.tk-phase>summary .tk-ph-title::before{content:'';flex:none;width:7px;height:7px;
  border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details.fold[open]>summary::before,.tk-phase[open]>summary .tk-ph-title::before{transform:rotate(45deg)}
details.fold>summary h2{font-size:1.02rem;margin:0}
.fold-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);font-weight:700;
  font-variant-numeric:tabular-nums}
.chip{padding:2px 8px;border-radius:999px;white-space:nowrap;font-size:.78rem;font-weight:700}
.tk-score.chip{border-radius:10px;padding:7px 4px;white-space:normal}
.chip.done,.chip.c{background:var(--brand-l);color:var(--brand-d)}.chip.draft,.chip.p{background:var(--amber-l);color:var(--amber)}
.chip.gap,.chip.h{background:var(--slate-l);color:var(--slate)}.chip.flag,.chip.b{background:var(--red-l);color:var(--red)}
.chip.n{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.bar{display:flex;height:6px;width:90px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .done,.bar .c{background:var(--brand)}.bar .draft,.bar .p{background:var(--amber)}
.bar .gap{background:var(--slate)}.bar .b{background:var(--red)}
.fold-body{padding:4px 16px 16px;border-top:1px solid var(--line-soft)}
.fold-body>p.desc{margin:10px 0 12px;color:var(--muted);font-size:.88rem}
.fold-body .list{margin-top:8px}
/* ---------- Tasks tab ---------- */
.tk-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;margin:26px 0 14px}
.tk-summary>div{background:var(--surface);padding:16px 12px;text-align:center}
.tk-summary b{display:block;font-size:1.8rem;font-family:var(--display);color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.tk-summary span{display:block;margin-top:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.tk-overall{display:flex;align-items:center;gap:12px}
.tk-overall .bar{flex:1;width:auto;height:10px}
.tk-overall b{font-family:var(--display);color:var(--brand-d);font-size:.95rem;white-space:nowrap}
.tk-intro{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.tk-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 6px}
.tk-filters button{font:inherit;font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--body)}
.tk-filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tk-filters select,.tk-filters input{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tk-filters input{flex:1;min-width:160px}
.tk-phase{margin-top:10px}
.tk-phase>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px 16px;
  flex-wrap:wrap;padding:12px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.tk-phase[open]>summary{margin-bottom:10px;border-color:var(--brand)}
.tk-ph-title{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.tk-ph-title::before{align-self:center}
.tk-ph-title h2{font-size:1.1rem}.tk-ph-title p{margin:0;font-size:.82rem;color:var(--muted)}
.tk-ph-prog{display:flex;align-items:center;gap:10px}.tk-ph-prog .bar{width:120px;height:8px}
.tk-ids{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 6px;margin:2px 0 0 19px}
.tk-id{font-weight:800;font-size:.72rem;letter-spacing:.02em;padding:2px 7px;border-radius:6px;text-decoration:none;
  border:1px solid transparent;font-variant-numeric:tabular-nums}
.tk-id:hover,.tk-id:focus-visible{border-color:currentColor;outline:none}
.tk-id.c{background:var(--brand-l);color:var(--brand-d)}.tk-id.p{background:var(--amber-l);color:var(--amber)}
.tk-id.b{background:var(--red-l);color:var(--red)}.tk-id.h{background:var(--slate-l);color:var(--slate)}
.tk-id.n{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
@media(max-width:640px){.tk-id{padding:7px 10px;font-size:.78rem}.tk-ids{gap:6px 8px}}  /* bigger touch targets on a phone */
.tk-task{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.tk-task>summary{list-style:none;cursor:pointer;padding:12px 16px 12px 12px;display:grid;
  grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.tk-score{grid-row:1/3;width:60px;padding:7px 4px;border-radius:10px;text-align:center;line-height:1}
.tk-score b{display:block;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.tk-score span{display:block;margin-top:4px;font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tk-task>summary h3{font-size:.96rem}.tk-task>summary h3 small{font-weight:600;color:var(--muted);font-size:.78rem;margin-right:8px}
.tk-meta{grid-column:2/-1;display:flex;gap:12px;align-items:center;font-size:.8rem;color:var(--muted)}
.tk-meta .bar{flex:1;max-width:240px}
.tk-body{padding:0 16px 12px;border-top:1px solid var(--line-soft)}
.tk-done{margin:12px 0 6px;font-size:.86rem}
.tk-subs{list-style:none;margin:0;padding:0}
.tk-subs li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:9px 0;
  border-top:1px solid var(--line-soft);font-size:.9rem;color:var(--ink)}
.tk-subs li:first-child{border-top:0}
.tk-subs li em{display:block;font-style:normal;font-size:.8rem;color:var(--muted)}
.tk-empty{padding:24px;text-align:center;color:var(--muted)}
/* ---------- Diagrams tab ---------- */
.dg-nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.dg-nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:.82rem;font-weight:700;background:var(--surface)}
.dg-ver{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.dg-ver.current{border-color:var(--brand)}
.dg-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--ink)}
.dg-ver>summary{list-style:none;cursor:pointer}
.dg-ver>summary::after{content:'Show';margin-left:auto;font-size:.75rem;font-weight:700;color:var(--muted)}
.dg-ver[open]>summary::after{content:'Hide'}
.dg-ver p{margin:6px 0;font-size:.88rem}.dg-ver p b{color:var(--muted)}
.dg-changed{border-left:3px solid var(--amber);padding-left:10px}
.dg-ver.superseded{opacity:.55}.dg-ver.superseded .dg-head{text-decoration:line-through}.dg-ver.superseded svg{filter:grayscale(1)}
.dg-ver svg{width:100%;height:auto;display:block;margin:10px 0 0}
.dg-ver .b{stroke-width:.9}.dg-ver .b.a{fill:var(--slate-l);stroke:var(--slate)}.dg-ver .b.c{fill:var(--brand-l);stroke:var(--brand)}
.dg-ver .b.d{fill:var(--amber-l);stroke:var(--amber)}.dg-ver .b.n{fill:var(--surface);stroke:var(--muted)}
.dg-ver .tt{fill:var(--ink);font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.dg-ver .ts{fill:var(--muted);font-size:12px;text-anchor:middle;dominant-baseline:central}
.dg-ver .tl{fill:var(--ink);font-size:14px;font-weight:700;dominant-baseline:central}
.dg-ver .frame{fill:none;stroke:var(--muted);stroke-dasharray:5 4;stroke-width:.9}
.dg-ver .ar{fill:none;stroke:var(--muted);stroke-width:1.3}.dg-ver .ar.dash{stroke-dasharray:5 4}
@media(max-width:640px){
  .summary,.tk-summary{grid-template-columns:1fr 1fr}.tk-summary>div:last-child{grid-column:1/-1}
  .row{flex-direction:column}
  .pill{align-self:flex-start}
  .wrap{padding:28px 16px 70px}
  .tabs button{padding:10px 8px}
  details.fold>summary{grid-template-columns:auto 1fr;padding:10px 14px}
  details.fold>summary .fold-meta{grid-column:2}
  .fold-bar{justify-content:flex-start}
  .tk-task>summary{grid-template-columns:auto 1fr}.tk-task>summary>.chip:not(.tk-score){grid-column:2;justify-self:start}
  .tk-score{grid-row:1/4}.tk-meta{grid-column:2}.tk-ph-prog .bar{width:80px}
  .tk-subs li{flex-direction:column;gap:4px}
}
@media print{details>.fold-body,details>.tk-body{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="mark" id="markInitials">--</div>
    <div class="top-text">
      <p id="orgLabel">ORGANIZATION</p>
      <h1 id="pageTitle">Project status</h1>
    </div>
  </div>
  <p class="updated" id="updatedLine"></p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Status page views" hidden>
    <button type="button" role="tab" id="tab-status" aria-controls="panel-status" aria-selected="true">Status</button>
    <button type="button" role="tab" id="tab-tasks" aria-controls="panel-tasks" aria-selected="false" hidden>Tasks<span id="tab-tasks-count"></span></button>
    <button type="button" role="tab" id="tab-diagrams" aria-controls="panel-diagrams" aria-selected="false" hidden>Diagrams<span id="tab-diagrams-count"></span></button>
  </nav>
  <div class="panel" id="panel-status" role="tabpanel" aria-labelledby="tab-status">
    <div class="summary" id="summaryStrip"></div>
    <div class="legend">
      <span><i class="i-done"></i> Done — built, tested, real data</span>
      <span><i class="i-draft"></i> Draft — written, not yet confirmed</span>
      <span><i class="i-flag"></i> Needs a decision</span>
      <span><i class="i-gap"></i> Left for later, on purpose</span>
    </div>
    <div class="fold-bar"><button type="button" data-fold="open">Expand all</button><button type="button" data-fold="close">Collapse all</button></div>
    <div id="decisionsHost"></div>
    <div id="groupsHost"></div>
  </div>
  <div class="panel" id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden></div>
  <div class="panel" id="panel-diagrams" role="tabpanel" aria-labelledby="tab-diagrams" hidden></div>
  <footer id="footerNote"></footer>
</div>

 * Fold rule: every section, phase, task and diagram topic opens as ONE LINE showing its title and
 * its counts (chips + a mini bar), so the whole page reads as an overview. The viewer opens only

   "tag": "Form address",
   "title": "The form's delivery address is readable in the page source",
   "body": "The contact form posts to a Google Apps Script address, and anyone who views the page source can see it. That is normal and unavoidable for a form on a static site, and the sheet behind it stays private — but it means a determined person could send messages straight to the script, bypassing the page. The script already defends itself: it rejects anything missing required fields, trims very long messages, allows twenty per hour, and ignores anything that trips the spam trap. Worth knowing it is there, and worth replacing the address if the sheet ever starts filling with rubbish."

const tally = items => ['done', 'draft', 'gap'].map(k => [k, items.filter(i => i.status === k).length]);
const all = d.groups.flatMap(g => g.items);
const [[, nDone], [, nDraft], [, nGap]] = tally(all);
$('summaryStrip').innerHTML = `
  <div class="n-done"><b>${nDone}</b><span>Done</span></div>
  <div class="n-draft"><b>${nDraft}</b><span>Draft — needs review</span></div>
  <div class="n-flag"><b>${d.decisions.length}</b><span>Needs your decision</span></div>
  <div class="n-gap"><b>${nGap}</b><span>Left for later</span></div>`;
if (d.decisions.length) $('decisionsHost').innerHTML = fold('decisions', 'Needs your decision',
  `<span class="chip flag">${d.decisions.length} to decide</span>`,
  `<p class="desc">Nothing breaks if these wait — but don't ship to real users until they're settled.</p>` +
  d.decisions.map(x => `<div class="decision"><span class="tag">${esc(x.tag)}</span><h3>${esc(x.title)}</h3><p>${x.body}</p></div>`).join(''));
$('groupsHost').innerHTML = d.groups.map(g => {
  const t = tally(g.items).filter(([, n]) => n);
  return fold('g-' + slug(g.title), g.title, t.map(([k, n]) => `<span class="chip ${k}">${n} ${LABEL[k].toLowerCase()}</span>`).join('') + bar(t),
    (g.description ? `<p class="desc">${esc(g.description)}</p>` : '') + `<div class="list">${g.items.map(item => `
      <div class="row"><div class="row-text"><h4>${esc(item.name)}</h4><p>${item.description}</p>
        ${item.admin ? '<div class="row-badges"><span class="admin-badge">Good admin-panel candidate</span></div>' : ''}</div>
        <span class="pill pill-${item.status}">${LABEL[item.status] || esc(item.status)}</span></div>`).join('')}</div>`);
}).join('');

// ---------- Tasks tab ----------
const T = d.tasks;
if (T) {
  const TL = {c: 'Completed', p: 'In progress', n: 'Not started', b: 'Blocked', h: 'On hold'};
  const count = subs => subs.reduce((a, s) => (a[s.s]++, a), {c: 0, p: 0, n: 0, b: 0, h: 0});
  const statusOf = subs => subs.every(s => s.s === 'c') ? 'c' : subs.some(s => s.s === 'p' || s.s === 'c') ? 'p'
    : subs.some(s => s.s === 'b') ? 'b' : subs.every(s => s.s === 'h') ? 'h' : 'n';
  const subs = T.tasks.flatMap(t => t.subs), tot = count(subs), active = subs.length - tot.h;
  $('tab-tasks').hidden = false; $('tab-tasks-count').textContent = `${tot.c}/${active} done`;
  const state = {st: 'all', phase: 'all', q: ''}, opened = new Set();
  const host = $('panel-tasks');
  host.innerHTML = `${T.note ? `<p class="tk-intro">${esc(T.note)}</p>` : ''}
    <p class="tk-intro">Updated ${esc(T.updated || '')}${T.deadline ? ' · deadline ' + esc(T.deadline) : ''}. On-hold items are not counted in the progress total.</p>
    <div class="tk-summary">${['c', 'p', 'n', 'b', 'h'].map(k => `<div><b>${tot[k]}</b><span>${TL[k]}</span></div>`).join('')}</div>
    <div class="tk-overall">${bar([['c', tot.c], ['p', tot.p], ['b', tot.b], ['n', tot.n]])}<b>${tot.c} of ${active} done · ${pct(tot.c, active)}%</b></div>
    <div class="tk-filters" role="group" aria-label="Filter tasks">
      ${['all', 'p', 'b', 'n', 'c', 'h'].map(k => `<button type="button" data-st="${k}" aria-pressed="${k === 'all'}">${k === 'all' ? 'All' : TL[k]}</button>`).join('')}
      <select aria-label="Phase"><option value="all">All phases</option>${T.phases.map(p => `<option value="${esc(p.id)}">${esc(p.id)} ${esc(p.title)}</option>`).join('')}</select>
      <input type="search" placeholder="Search tasks" aria-label="Search tasks">
    </div>
    <div class="fold-bar"><button type="button" data-fold="open">Expand all</button><button type="button" data-fold="close">Collapse all</button></div>
    <div id="tk-list"></div>`;
  const render = () => {
    const q = state.q.toLowerCase(), filtering = state.st !== 'all' || !!q;
    let out = '';
    for (const ph of T.phases) {
      if (state.phase !== 'all' && state.phase !== ph.id) continue;
      const tasks = T.tasks.filter(t => t.phase === ph.id);
      let block = '';
      const ids = [];  // task ids for the phase heading; same filter as the list below
      for (const t of tasks) {
        const hit = !q || [t.title, t.id, t.area, t.who].join(' ').toLowerCase().includes(q);
        const shown = t.subs.filter(s => (state.st === 'all' || s.s === state.st) && (hit || (s.t + ' ' + (s.n || '')).toLowerCase().includes(q)));
        if (!shown.length) continue;
        const st = statusOf(t.subs), k = count(t.subs);
        ids.push(`<a class="tk-id ${st}" href="#tk-${esc(t.id)}" title="${esc(t.id)} · ${esc(t.title)} · ${k.c}/${t.subs.length} done">${esc(t.id)}</a>`);
        block += `<details class="tk-task" id="tk-${esc(t.id)}" data-key="${esc(t.id)}" ${filtering || opened.has(t.id) ? 'open' : ''}><summary>
          <div class="tk-score chip ${st}" aria-label="${k.c} of ${t.subs.length} sub-tasks done"><b>${k.c}/${t.subs.length}</b><span>done</span></div>
          <h3><small>${esc(t.id)}</small>${esc(t.title)}</h3><span class="chip ${st}">${TL[st]}</span>
          <div class="tk-meta">${bar([['c', k.c], ['p', k.p], ['b', k.b], ['n', k.n]])}<span>${esc([t.area, t.who].filter(Boolean).join(' · '))}</span></div>
          </summary><div class="tk-body">${t.doneWhen ? `<p class="tk-done"><b>Done when:</b> ${esc(t.doneWhen)}</p>` : ''}<ul class="tk-subs">
          ${shown.map(s => `<li><span>${esc(s.t)}${s.n ? `<em>${esc(s.n)}</em>` : ''}</span><span class="chip ${s.s}">${TL[s.s]}</span></li>`).join('')}</ul></div></details>`;
      }
      if (!block) continue;
      const ps = tasks.flatMap(t => t.subs), pk = count(ps), pst = statusOf(ps);
      out += `<details class="tk-phase" data-key="${esc(ph.id)}" ${filtering || state.phase !== 'all' || opened.has(ph.id) ? 'open' : ''}><summary>
        <span class="tk-ph-title"><h2>${esc(ph.id)} · ${esc(ph.title)}</h2><p>${esc(ph.dates || '')}</p></span>
        <span class="tk-ph-prog">${bar([['c', pk.c], ['p', pk.p], ['b', pk.b], ['n', pk.n]])}<span class="chip ${pst}">${pk.c}/${ps.length} done · ${pct(pk.c, ps.length)}%</span></span>
        <span class="tk-ids" aria-label="Tasks in ${esc(ph.id)}">${ids.join('')}</span>
        </summary>${block}</details>`;
    }
    $('tk-list').innerHTML = out || '<p class="tk-empty">No tasks match.</p>';
  };
  host.addEventListener('toggle', e => {  // remember what the viewer opened, across re-renders
    const key = e.target.dataset && e.target.dataset.key;
    if (key && state.st === 'all' && !state.q) e.target.open ? opened.add(key) : opened.delete(key);
  }, true);
  host.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => {
    state.st = b.dataset.st; host.querySelectorAll('[data-st]').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
  }));
  host.querySelector('select').addEventListener('change', e => { state.phase = e.target.value; render(); });
  host.querySelector('input').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
  render();
}

// ---------- Diagrams tab ----------
const G = d.diagrams;
if (G && G.length) {
  $('tab-diagrams').hidden = false;
  $('tab-diagrams-count').textContent = G.reduce((a, t) => a + t.versions.length, 0);
  $('panel-diagrams').innerHTML = `<p class="tk-intro">Every design diagram, dated, with why it was added. When a decision changes, the new version goes below the old one; old versions stay, greyed out and struck through.</p>
    <nav class="dg-nav" aria-label="Diagram topics">${G.map(t => `<a href="#dg-${esc(t.id)}">${esc(t.title)}</a>`).join('')}</nav>
    <div class="fold-bar"><button type="button" data-fold="open">Expand all</button><button type="button" data-fold="close">Collapse all</button></div>` +
    G.map(t => {
      const cur = [...t.versions].reverse().find(v => v.status === 'current') || t.versions[t.versions.length - 1];
      const when = v => esc(v.date) + (v.time ? ', ' + esc(v.time) : '');
      return fold('dg-' + t.id, t.title, `<span class="chip c">${esc(cur.v)}</span>${when(cur)} · ${t.versions.length} version${t.versions.length > 1 ? 's' : ''}`,
        t.versions.map(v => {
          const isCur = v.status === 'current';
          const head = `<strong class="dg-head">${esc(v.v)} · ${when(v)}</strong><span class="chip ${isCur ? 'c' : 'h'}">${isCur ? 'CURRENT' : 'SUPERSEDED'}</span>`;
          const body = `<p><b>Why added:</b> ${esc(v.why)}</p>${v.context ? `<p><b>Context:</b> ${esc(v.context)}</p>` : ''}` +
            (v.changed ? `<p class="dg-changed"><b>${isCur ? 'Why this version' : 'What changed'}:</b> ${esc(v.changed)}</p>` : '') +
            (v.built ? `<p><b>Built:</b> ${esc(v.built)}</p>` : '') + (v.svg || '');
          return isCur ? `<article class="dg-ver current"><div class="dg-meta">${head}</div>${body}</article>`
            : `<details class="dg-ver superseded"><summary class="dg-meta">${head}</summary>${body}</details>`;
        }).join(''));
    }).join('');
}

// ---------- Tabs, fold bars, links ----------
const TABS = ['status', 'tasks', 'diagrams'].filter(n => !$('tab-' + n).hidden);
if (TABS.length > 1) $('tabs').hidden = false;
const show = name => TABS.forEach(n => { $('tab-' + n).setAttribute('aria-selected', n === name); $('panel-' + n).hidden = n !== name; });
TABS.forEach(n => $('tab-' + n).addEventListener('click', () => { show(n); history.replaceState(null, '', n === 'status' ? location.pathname : '#' + n); }));
$('tabs').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = Math.max(TABS.indexOf(document.activeElement.id.slice(4)), 0);
  const next = $('tab-' + TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length]); next.focus(); next.click();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fold]');
  if (b) { b.closest('.panel').querySelectorAll('details').forEach(x => { x.open = b.dataset.fold === 'open'; }); return; }
  const a = e.target.closest('a[href^="#"]'), id = a && a.getAttribute('href').slice(1);
  if (id && $(id) && !TABS.includes(id)) { e.preventDefault(); reveal(id); history.replaceState(null, '', '#' + id); }
});
function reveal(id) {
  const el = $(id); if (!el) return;
  const panel = el.closest('.panel'); if (panel) show(panel.id.slice(6));
  for (let p = el; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  el.scrollIntoView({block: 'start'});
}
const openHash = () => { const h = location.hash.slice(1); if (TABS.includes(h)) show(h); else if (h) reveal(h); };
window.addEventListener('hashchange', openHash);
openHash();
})();
</script>
</body>
</html>
